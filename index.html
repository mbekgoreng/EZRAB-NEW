<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/ez-emblem.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>EZRAB — RAB & Estimasi Konstruksi</title>
    <meta name="description" content="EZRAB membantu menyusun RAB, QTO, AHSP, BOQ, Kurva S, dan laporan proyek dalam satu workspace." />
    <meta property="og:title" content="EZRAB — RAB & Estimasi Konstruksi" />
    <meta property="og:description" content="Satu workspace untuk RAB, QTO, AHSP, BOQ, Kurva S, dan laporan proyek." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <!-- Layar muat bermerek: tampil seketika dari HTML sebelum bundle JS selesai
         diunduh/di-parse, agar muat awal tidak berupa layar putih polos.
         React mengganti isi #root saat aplikasi me-mount, jadi penanda ini
         hilang dengan sendirinya. Semua aturan dibatasi kelas .ezrab-boot —
         tidak ada efek tersisa setelah aplikasi tampil. -->
    <style>
      .ezrab-boot{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(120% 90% at 50% 0%,#12263F 0%,#0A2540 55%,#071A30 100%);color:#fff;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
      .ezrab-boot-logo{display:block;height:40px;width:auto;filter:brightness(0) invert(1)}
      .ezrab-boot-tag{font-size:13px;color:#B9C9DE;letter-spacing:.02em}
      .ezrab-boot-bar{width:148px;height:3px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
      .ezrab-boot-bar i{display:block;height:100%;width:40%;border-radius:999px;background:#2563EB;animation:ezrab-boot-slide 1.1s ease-in-out infinite}
      @keyframes ezrab-boot-slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
      @media (prefers-reduced-motion: reduce){.ezrab-boot-bar i{animation:none;width:100%}}
    </style>
  </head>
  <body>
    <div id="root"><div class="ezrab-boot" role="status" aria-label="Memuat EZRAB"><img class="ezrab-boot-logo" src="/images/ezrab-logo.png" alt="EZRAB" /><div class="ezrab-boot-tag">RAB &amp; Estimasi Konstruksi</div><div class="ezrab-boot-bar"><i></i></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
