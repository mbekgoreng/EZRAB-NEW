# EZRAB — konfigurasi Nginx untuk container web (dan pola yang sama untuk
# reverse proxy di host EC2/VPS). Padanan portabel dari vercel.json:
# rewrites (SPA fallback + blog), headers keamanan, dan proxy /api.
#
# Catatan host blog: di Vercel, host blog.ezrab.site di-rewrite ke /blog/*
# dan root '/' blog dilayani dari /blog/index.html lewat Edge Middleware.
# Di sini hal yang sama dicapai dengan blok server kedua (diaktifkan di
# host produksi dengan server_name blog.ezrab.site — di dalam container
# lokal blok ini tidak berbahaya karena tidak terpicu).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Header keamanan — sama dengan blok headers vercel.json.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Aset ber-hash: cache panjang.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API -> runner persisten (service "api" di docker compose).
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gateway AI boleh berjalan lama (di Vercel maxDuration 300 dtk).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 5m;
    }

    # Gerbang akses: /app/* tanpa sesi diarahkan ke /access oleh gerbang
    # di sisi API? TIDAK — halaman adalah dokumen statis; gerbang dokumen
    # di Vercel hidup di Edge Middleware. Padanan portabelnya: halaman
    # /access dan pemeriksaan sesi dilakukan SPA lewat /api/access/session
    # (sudah menjadi perilaku aplikasi), dan endpoint sensitif ter-gate
    # di runner. Untuk penegakan dokumen setara middleware di host,
    # aktifkan auth_request pada blok server host (lihat
    # docs/deployment/AWS_DEPLOYMENT.md bagian "Gerbang akses").

    # File statis yang benar-benar ada (blog prerender, robots, sitemap).
    location /blog/ {
        try_files $uri $uri/ =404;
    }

    # SPA fallback — padanan rewrite "/((?!api/).*) -> /index.html".
    location / {
        try_files $uri $uri/ /index.html;
    }
}
