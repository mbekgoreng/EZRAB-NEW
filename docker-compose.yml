# EZRAB — Docker Compose LOKAL/STAGING.
# Membuktikan aplikasi berjalan penuh di luar Vercel:
#   web  -> Nginx menyajikan build statis + proxy /api
#   api  -> runner Node persisten melayani handler api/ yang sama
#   db   -> (opsional, profile "localdb") PostgreSQL lokal HANYA untuk uji
#           backup/restore; produksi TIDAK memakainya secara default —
#           database produksi adalah Supabase cloud (lihat
#           docs/deployment/VERCEL_TO_AWS_MIGRATION_REPORT.md).
# Pakai: cp deployment/.env.example .env.docker lalu isi seperlunya, lalu
#   docker compose --env-file .env.docker up --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_EZRAB_API_BASE_URL: ${VITE_EZRAB_API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # env_file meneruskan SELURUH variabel .env.docker (termasuk pool kunci
    # provider bernomor: GEMINI_API_KEY_*, ATRIA_API_KEY_*, DAHL_API_KEY_*,
    # RIVER_API_KEY_*, GEMINI_OAI_KEY_*, CROWN_API_KEY_*) — daftar
    # `environment:` di bawah hanya penegas nama-nama inti, BUKAN whitelist;
    # kunci yang tidak terdaftar tidak boleh terbuang.
    env_file:
      - .env.docker
    environment:
      PORT: 3001
      # Semua nama di bawah diteruskan dari .env.docker; nilai kosong =
      # fitur terkait nonaktif secara jujur (fail-closed), sama seperti
      # perilaku di Vercel. JANGAN commit file .env.docker.
      EZRAB_ACCESS_CODE: ${EZRAB_ACCESS_CODE:-}
      EZRAB_ACCESS_SESSION_SECRET: ${EZRAB_ACCESS_SESSION_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-}
      AI_ALLOW_ANONYMOUS: ${AI_ALLOW_ANONYMOUS:-}
      AI_RATE_LIMIT_PER_MIN: ${AI_RATE_LIMIT_PER_MIN:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      CREDITS_DB_CONFIGURED: ${CREDITS_DB_CONFIGURED:-}
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GEMINI_API_KEY_4: ${GEMINI_API_KEY_4:-}
      GEMINI_API_KEY_5: ${GEMINI_API_KEY_5:-}
      GEMINI_API_KEY_6: ${GEMINI_API_KEY_6:-}
      ZYROUTER_API_KEY: ${ZYROUTER_API_KEY:-}
      ZROUTER_API_KEY: ${ZROUTER_API_KEY:-}
      ATRIA_API_KEY_1: ${ATRIA_API_KEY_1:-}
      CROWN_API_KEY: ${CROWN_API_KEY:-}
      ATMO_API_KEY: ${ATMO_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
    volumes:
      # Volume persisten untuk upload/branding yang ditulis backend
      # persisten; aplikasi saat ini tidak menulis upload ke disk lokal
      # (lihat laporan migrasi), volume disiapkan agar jalur itu aman
      # dari restart container.
      - ezrab_uploads:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    environment:
      POSTGRES_DB: ezrab_local
      POSTGRES_USER: ezrab
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-ezrab-local-only}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ezrab_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ezrab_uploads:
  ezrab_pgdata:
